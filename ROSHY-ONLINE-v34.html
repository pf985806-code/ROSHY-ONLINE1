<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06101f">
<title>ROSHY ONLINE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden; background: #06101f;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #loading {
    position: fixed; left: 0; top: 0; background: #06101f; transform-origin: 0 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 600ms ease, transform 600ms ease;
  }
  #loading.leaving { opacity: 0; transform: scale(1.03); pointer-events: none; }


  /* Palco com a proporção exata da arte (1672x941). 1em = 1% da largura do palco. */
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1672 / 941));
    width: min(100vw, calc(100dvh * 1672 / 941));
    aspect-ratio: 1672 / 941;
    font-size: min(1vw, 1.7769vh);
    font-size: min(1vw, 1.7769dvh);
  }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Todas as peças abaixo usam % do palco, então encaixam na arte em qualquer tela */
  .abs { position: absolute; }

  /* Dica: cobre a dica desenhada na arte e mostra a dinâmica */
  .tip {
    left: 20.1%; top: 82.6%; width: 59.8%; height: 6.2%;
    display: flex; align-items: center; justify-content: center; gap: 0.8em;
    border-radius: 1.2em;
    background: rgba(8,11,16,1); box-shadow: 0 0 1.6em 0.8em rgba(8,11,16,1);
    color: #fff; font-size: 1.75em; white-space: nowrap;
    text-shadow: 0 0.08em 0.2em #000;
    transition: opacity 350ms ease, transform 350ms ease;
  }
  .tip.hidden { opacity: 0; transform: translateY(0.3em); }
  .tip .hl { color: #ffd54a; }
  .tip svg { width: 1.1em; height: 1.1em; flex: none; color: #ffd54a;
    filter: drop-shadow(0 0 0.25em rgba(255,213,74,.8)); }

  /* Trilho escuro que apaga a barra "presa em 75%" da arte */
  .track {
    left: 18.66%; top: 89.5%; width: 61.4%; height: 3.4%;
    background: linear-gradient(#050504, #141311);
    border-radius: 0.5em;
    overflow: hidden;
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    border-radius: 0.5em;
    background: linear-gradient(#ffe23a 0%, #fcc900 40%, #fdab01 72%, #b56b04 100%);
    box-shadow: 0 0 1.2em rgba(255, 200, 40, 0.6);
    overflow: hidden;
  }
  .fill::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 8em; left: -10em;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: sweep 1.6s linear infinite;
  }
  @keyframes sweep { to { left: 120%; } }



  /* Joia original da arte, recortada da própria imagem e mantida por cima da barra */
  .gemwin { left: 48.0%; top: 87.6%; width: 3.9%; height: 7.4%; background-repeat: no-repeat; }

  /* Porcentagem real, cobrindo o "75%" desenhado */
  .pct {
    left: 46.9%; top: 94%; width: 6.2%; height: 4.3%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 18, 8, 1);
    box-shadow: 0 0 1em 0.5em rgba(10, 18, 8, 1);
    border-radius: 0.8em;
    color: #fff; font-weight: 700; font-size: 2.2em;
    text-shadow: 0 0.06em 0.18em #000;
    font-variant-numeric: tabular-nums;
  }


  @media (prefers-reduced-motion: reduce) {
    .fill::after { animation: none; }
    .tip, #loading { transition: none; }
  }

/* ROSHY ONLINE - estilos das telas do jogo (criação de personagem e entrada no mundo) */
#rg { position: fixed; left: 0; top: 0; z-index: 50; overflow: hidden; display: none; background: #0b1224;
  transform-origin: 0 0; --u: 8px; color: #f4ecd0; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; opacity: 0; transition: opacity 500ms ease; }
#rg.on { display: block; }
#rg.vis { opacity: 1; }
#rg * { box-sizing: border-box; }
.rg-bg { position: absolute; inset: -4%; background-size: cover; background-position: center; filter: blur(6px) brightness(0.55) saturate(1.1); }
.rg-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(5,9,20,0) 30%, rgba(5,9,20,0.78) 100%); pointer-events: none; }
.rg-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
.rg-ui { position: absolute; inset: 0; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity 400ms ease; }
.rg-ui.show { opacity: 1; visibility: visible; }
.rg-ui > * { pointer-events: auto; }

.rg-title { position: absolute; top: calc(var(--u) * 1.6); left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none !important; white-space: nowrap; }
.rg-title h1 { font-family: Georgia, "Times New Roman", serif; font-size: max(15px, calc(var(--u) * 3.3)); letter-spacing: 0.12em; font-weight: 700;
  background: linear-gradient(#fff2b0, #f5c542 55%, #b8800f); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.8)); }
.rg-title p { font-size: max(10px, calc(var(--u) * 1.7)); color: #cfd6ea; text-shadow: 0 1px 3px #000; margin-top: calc(var(--u) * 0.2); }

.gold { border: calc(var(--u) * 0.28) solid #b8800f; border-image: linear-gradient(#fff2b0, #f5c542 45%, #8a5c0a) 1;
  background: rgba(9, 15, 32, 0.84); box-shadow: 0 calc(var(--u) * 0.5) calc(var(--u) * 2) rgba(0, 0, 0, 0.55); }

.rg-left { position: absolute; left: calc(var(--u) * 1.6); top: calc(var(--u) * 8.2); bottom: calc(var(--u) * 11.5); display: flex; gap: calc(var(--u) * 0.8); }
.rg-tabs { display: flex; flex-direction: column; gap: calc(var(--u) * 0.7); }
.rg-tab { width: calc(var(--u) * 8); flex: 1; max-height: calc(var(--u) * 9.5); min-height: calc(var(--u) * 6); border-radius: calc(var(--u) * 1); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 0.3);
  background: rgba(9, 15, 32, 0.84); border: calc(var(--u) * 0.22) solid #5a4a22; color: #cfc6a0;
  font-size: max(9px, calc(var(--u) * 1.55)); font-family: inherit; padding: 0; transition: transform 120ms; }
.rg-tab svg { width: calc(var(--u) * 3.1); height: calc(var(--u) * 3.1); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rg-tab.on { color: #1a1204; background: linear-gradient(#fff2b0, #f5c542 55%, #c98d14); border-color: #fff2b0; transform: scale(1.04); }
.rg-panel { width: calc(var(--u) * 27); overflow-y: auto; overflow-x: hidden; padding: calc(var(--u) * 1.3); border-radius: calc(var(--u) * 1); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.rg-panel::-webkit-scrollbar { width: calc(var(--u) * 0.6); }
.rg-panel::-webkit-scrollbar-thumb { background: #b8800f; border-radius: 9px; }
.rg-page { display: none; }
.rg-page.on { display: block; }

.rg-row { margin-bottom: calc(var(--u) * 1.5); }
.rg-lab { font-size: max(10px, calc(var(--u) * 1.6)); color: #f5c542; text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: calc(var(--u) * 0.6); font-weight: 700; }
.rg-chips { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 0.6); }
.rg-chips.c3 { grid-template-columns: 1fr 1fr 1fr; }
.rg-chip { min-height: calc(var(--u) * 4.8); padding: calc(var(--u) * 0.4) calc(var(--u) * 0.6); border-radius: calc(var(--u) * 0.9); cursor: pointer; font-family: inherit;
  font-size: max(10px, calc(var(--u) * 1.7)); color: #e9e2c6; background: rgba(40, 52, 88, 0.7); border: calc(var(--u) * 0.2) solid #3b4a78; }
.rg-chip.on { color: #1a1204; background: linear-gradient(#fff2b0, #f5c542 60%, #cf9418); border-color: #fff2b0; font-weight: 700; }
.rg-sw { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 0.7); }
.rg-dot { width: calc(var(--u) * 4.3); height: calc(var(--u) * 4.3); border-radius: 50%; cursor: pointer; border: calc(var(--u) * 0.25) solid rgba(255, 255, 255, 0.35);
  box-shadow: inset 0 calc(var(--u) * -0.5) calc(var(--u) * 0.6) rgba(0, 0, 0, 0.25); padding: 0; }
.rg-dot.on { border-color: #ffe27a; box-shadow: 0 0 0 calc(var(--u) * 0.3) #b8800f, 0 0 calc(var(--u) * 1) rgba(255, 210, 90, 0.8); transform: scale(1.1); }
.rg-range { width: 100%; height: calc(var(--u) * 3.6); margin: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: pan-y; }
.rg-range::-webkit-slider-runnable-track { height: calc(var(--u) * 1); border-radius: 9px; background: linear-gradient(90deg, #4a3a14, #b8800f); }
.rg-range::-webkit-slider-thumb { -webkit-appearance: none; width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); margin-top: calc(var(--u) * -1.1); border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff8aa0, #d7193a 55%, #6e0716); border: calc(var(--u) * 0.25) solid #ffe27a; }
.rg-range::-moz-range-track { height: calc(var(--u) * 1); border-radius: 9px; background: linear-gradient(90deg, #4a3a14, #b8800f); }
.rg-range::-moz-range-thumb { width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: 50%; background: #d7193a; border: calc(var(--u) * 0.25) solid #ffe27a; }
.rg-sl-l { display: flex; justify-content: space-between; font-size: max(9px, calc(var(--u) * 1.4)); color: #aab3cf; }

.rg-right { position: absolute; right: calc(var(--u) * 1.6); top: calc(var(--u) * 8.2); width: calc(var(--u) * 24); padding: calc(var(--u) * 1.3); border-radius: calc(var(--u) * 1); }
.rg-input { width: 100%; height: calc(var(--u) * 5.8); border-radius: calc(var(--u) * 0.9); border: calc(var(--u) * 0.25) solid #b8800f; background: #0a1020; color: #fff;
  font-family: inherit; font-size: max(13px, calc(var(--u) * 2.2)); padding: 0 calc(var(--u) * 1.2); outline: none; -webkit-user-select: text; user-select: text; }
.rg-input:focus { border-color: #ffe27a; box-shadow: 0 0 calc(var(--u) * 1) rgba(255, 210, 90, 0.5); }
.rg-err { min-height: calc(var(--u) * 2.6); font-size: max(9px, calc(var(--u) * 1.5)); color: #ff8a8a; margin-top: calc(var(--u) * 0.5); line-height: 1.25; }
.rg-err.shake { animation: shake 300ms; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.rg-btn { width: 100%; min-height: calc(var(--u) * 5.2); margin-top: calc(var(--u) * 0.7); border-radius: calc(var(--u) * 0.9); cursor: pointer; font-family: inherit;
  font-size: max(10px, calc(var(--u) * 1.8)); color: #f4ecd0; background: rgba(40, 52, 88, 0.75); border: calc(var(--u) * 0.2) solid #3b4a78;
  display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 0.7); }
.rg-btn svg { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rg-btn.on { background: linear-gradient(#fff2b0, #f5c542 60%, #cf9418); color: #1a1204; border-color: #fff2b0; }
.rg-hint { font-size: max(9px, calc(var(--u) * 1.4)); color: #aab3cf; margin-top: calc(var(--u) * 1); line-height: 1.3; }

.rg-cta { position: absolute; left: 50%; bottom: calc(var(--u) * 2.2); transform: translateX(-50%); width: calc(var(--u) * 36); height: calc(var(--u) * 6.8); border: 0; cursor: pointer; font-family: Georgia, serif;
  font-weight: 700; letter-spacing: 0.1em; font-size: max(13px, calc(var(--u) * 2.5)); color: #2a1a02; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  --c: calc(var(--u) * 2.2); clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% 50%, calc(100% - var(--c)) 100%, var(--c) 100%, 0 50%);
  background: linear-gradient(#fff2b0, #f5c542 50%, #b8800f); filter: drop-shadow(0 4px 8px #000); }
.rg-cta::before { content: ""; position: absolute; inset: calc(var(--u) * 0.45); background: linear-gradient(#ffe27a, #f0b323 55%, #c98d14);
  clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% 50%, calc(100% - var(--c)) 100%, var(--c) 100%, 0 50%); z-index: -1; }
.rg-cta { z-index: 1; position: absolute; isolation: isolate; }
.rg-cta:active { transform: translateX(-50%) scale(0.97); }
.rg-cta[disabled] { opacity: 0.6; }

.rg-toast { position: absolute; left: 50%; top: calc(var(--u) * 8); transform: translateX(-50%); max-width: 70%; text-align: center; padding: calc(var(--u) * 1.2) calc(var(--u) * 2.2);
  border-radius: calc(var(--u) * 1); background: rgba(9, 15, 32, 0.94); border: calc(var(--u) * 0.2) solid #f5c542; color: #fff; font-size: max(11px, calc(var(--u) * 1.9));
  opacity: 0; transition: opacity 300ms; pointer-events: none; z-index: 5; }
.rg-toast.show { opacity: 1; }

/* tela de entrada no mundo */
.rg-plate { position: absolute; left: 50%; top: calc(var(--u) * 2); transform: translateX(-50%); text-align: center; padding: calc(var(--u) * 1) calc(var(--u) * 4); border-radius: calc(var(--u) * 1); pointer-events: none !important; }
.rg-plate b { display: block; font-family: Georgia, serif; font-size: max(15px, calc(var(--u) * 3.4)); color: #ffe27a; letter-spacing: 0.06em; }
.rg-plate span { font-size: max(10px, calc(var(--u) * 1.7)); color: #cfd6ea; }
.rg-wnote { position: absolute; left: 50%; bottom: calc(var(--u) * 10.5); transform: translateX(-50%); font-size: max(10px, calc(var(--u) * 1.7)); color: #dfe5f5; text-shadow: 0 1px 4px #000; text-align: center; white-space: nowrap; pointer-events: none !important; }
.rg-reset { position: absolute; right: calc(var(--u) * 1.6); top: calc(var(--u) * 1.6); width: auto; padding: 0 calc(var(--u) * 1.4); }

@media (prefers-reduced-motion: reduce) { #rg, .rg-ui { transition: none; } .rg-err.shake { animation: none; } }

/* ===== mundo aberto: HUD ===== */

.wd-ui { z-index: 3; }
.wd-btn { position: absolute; width: calc(var(--u) * 5.4); height: calc(var(--u) * 5.4); border-radius: 50%; border: calc(var(--u) * 0.25) solid #f5c542; background: rgba(12, 20, 40, 0.72); color: #ffe27a; font-size: max(18px, calc(var(--u) * 3)); font-family: Georgia, serif; cursor: pointer; padding: 0; line-height: 1; }
.wd-btn:active { transform: scale(0.93); }

.wd-chat { position:absolute; left:calc(var(--u) * 2); top:calc(var(--u) * 9); width:min( min(360px, 72vw), calc(var(--u) * 42)); max-height:36vh; display:none; flex-direction:column; gap:calc(var(--u) * .8); padding:calc(var(--u) * 1.2); border:1px solid #f5c542; border-radius:calc(var(--u) * 1.3); background:rgba(8,14,29,.28); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); color:#fff; z-index:7; box-shadow:0 4px 18px #0008; }

.wd-chat-log { background:rgba(5,10,20,.08); border-radius:8px; padding:4px; }
.wd-chat-line { padding:5px 7px; border-radius:7px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.07); }

 .wd-chat-send { border:1px solid #f5c542; border-radius:7px; background:#b98319; color:#1b1405; font-weight:700; padding:0 10px; }
.wd-menu { left: calc(var(--u) * 1.8); top: calc(var(--u) * 1.8); }
.wd-zin { right: calc(var(--u) * 2); bottom: calc(var(--u) * 12); }

.wd-map canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.wd-n { position: absolute; left: 50%; top: calc(var(--u) * -0.4); transform: translateX(-50%); font-size: max(9px, calc(var(--u) * 1.5)); color: #fff; font-weight: 700; text-shadow: 0 1px 3px #000; display: none; }
.wd-joy { position: absolute; left: calc(var(--u) * 3); bottom: calc(var(--u) * 3); width: calc(var(--u) * 19); height: calc(var(--u) * 19); touch-action: none; border-radius: 50%; }
.wd-ring { position: absolute; inset: 12%; border-radius: 50%; border: calc(var(--u) * 0.3) solid rgba(255, 226, 122, 0.55); background: rgba(10, 18, 34, 0.35); }
.wd-knob { position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; margin: -18% 0 0 -18%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe9a0, #d9a21c); border: calc(var(--u) * 0.25) solid #6b4a0e; box-shadow: 0 3px 8px rgba(0,0,0,.5); }
.wd-banner { position: absolute; left: 50%; top: calc(var(--u) * 5); transform: translate(-50%, -10px); padding: calc(var(--u) * 0.9) calc(var(--u) * 5); font-family: Georgia, serif; font-size: max(16px, calc(var(--u) * 3.4)); color: #ffe27a; letter-spacing: 0.08em; text-shadow: 0 2px 6px #000; background: linear-gradient(90deg, transparent, rgba(8,14,30,.7) 20%, rgba(8,14,30,.7) 80%, transparent); opacity: 0; transition: opacity 600ms, transform 600ms; pointer-events: none !important; white-space: nowrap; }
.wd-banner.show { opacity: 1; transform: translate(-50%, 0); }

<body>

<script>
/* ROSHY ONLINE - Mini3D
 * Motor 3D leve em WebGL1 para o visual estilizado do jogo:
 * sombreamento em faixas (toon), luz de contorno e contorno escuro (inverted hull).
 * Sem dependências externas.
 */
(function (global) {
  "use strict";

  // ======================= Matemática =======================
  function m4mul(a, b, o) {
    o = o || new Float32Array(16);
    for (var c = 0; c < 4; c++) {
      for (var r = 0; r < 4; r++) {
        o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];

  }
  function m4persp(fovy, asp, n, f) {
    var t = 1 / Math.tan(fovy / 2), o = new Float32Array(16);
    o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f);
    return o;
  }
  function m4look(e, t, up) {

    o[4] = xy; o[5] = yy; o[6] = zy;
    o[8] = xz; o[9] = yz; o[10] = zz;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
    o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);

  function endIntro(skip) {

    var m = S.model; m.root.rot[0] = 0; m.pose.tp = 0; m.pose.ab = 0; m.pose.hl = 0; m.pose.eyes = 1; m.pose.leg = 0; m.pose.knee = 0; resetSprings();

    if (skip) isoCam(0, true);

  }

  // ============================ LOOP ============================
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    if (FM.last) { var rd = now - FM.last; if (rd > 0 && rd < 1000) { FM.n++; FM.sum += rd; if (rd > FM.max) FM.max = rd; } }

    if (now - FM.pingT > 5000 && !(FM.p2p && performance.now() - FM.p2p < 6000)) { FM.pingT = now; try { var pt0 = performance.now(); fetch("https://www.gstatic.com/generate_204", { mode: "no-cors", cache: "no-store" }).then(function () { FM.ping = performance.now() - pt0; }, function () { FM.ping = -1; }); } catch (e) { FM.ping = -1; } }
    if (FM.sum >= 500) {
      FM.fps = FM.n * 1000 / FM.sum; FM.ms = FM.sum / FM.n; FM.worst = FM.max; FM.n = 0; FM.sum = 0; FM.max = 0;
      if (H.fpsEl) { H.fpsEl.style.display = FM.show ? "block" : "none"; if (FM.show) H.fpsEl.textContent = "FPS " + Math.round(FM.fps) + "  ·  Ping " + (FM.ping >= 0 ? Math.round(FM.ping) + " ms" : "--");  }
    }
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    t += dt; fpsAcc += dt; fpsN++;
    if (fpsAcc > 1.2) { var fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; if (fps < 54 && dprQ > 0.55) { dprQ = Math.max(0.55, dprQ - 0.15); Stage.setDpr(dprQ); goodT = 0; } else if (fps > 58) { goodT += 1; if (goodT > 8 && dprQ < 1.25) { dprQ = Math.min(1.25, dprQ + 0.1); Stage.setDpr(dprQ); goodT = 0; } } else goodT = 0; }
    var cam;
    if (!paused) {
      if (intro.on) {
        intro.T += dt; var T = intro.T;
        H.fade.style.opacity = String(1 - sm(0.3, 3.6, T));
        poseIntro(T, dt);
        if (T > 3) H.skip.classList.add("show");
        if (T > 21.2 && !intro.text) { intro.text = true; H.text.classList.add("show"); }
        if (T > TEND) { endIntro(false); }
        else { cam = kfCam(T); if (A.ctx && A.master) A.master.gain.setTargetAtTime(A.on ? 0.9 : 0, A.ctx.currentTime, 0.8); }
        if (T > 22.6 && cam) { /* mantém */ }
      } else {
        updatePlayer(dt, true);
        multiplayerUpdate(dt, now);
        if (S.horses) S.horses.forEach(function (hf) { hf.update(dt, t, P); });
        chatPoll();
        if (intro.blend > 0 && introCam) { intro.blend = Math.max(0, intro.blend - dt / 3.2); }
        regionT += dt;
        if (regionT > 0.4) { regionT = 0; var r = RW.regionAt(P.x, P.z); if (r !== region) { region = r; showBanner(RW.REGIONS[r]); } }
        saveT += dt; if (saveT > 6) { saveT = 0; var f = loadFlag() || { intro: 1 }; f.x = P.x; f.z = P.z; saveFlag(f); }
      }
      if (!intro.on || true) { if (S.model && !intro.on) placeModel(); }
      S.model.update(t, P.yaw); if (!intro.on) S.model.root.rot[1] = P.yaw;
    }
    if (!cam) {
      cam = isoCam(dt, false);
      if (introCam && intro.blend > 0) { var w = sm(0, 1, intro.blend); cam = { eye: [lerp(cam.eye[0], introCam.eye[0], w), lerp(cam.eye[1], introCam.eye[1], w), lerp(cam.eye[2], introCam.eye[2], w)], target: [lerp(cam.target[0], introCam.target[0], w), lerp(cam.target[1], introCam.target[1], w), lerp(cam.target[2], introCam.target[2], w)] }; }
      else if (intro.on === false) introCam = null;

    if (S.horses) S.horses.forEach(function (hf) { hf.root.visible = !intro.on && hf.near; });
    ensureChunks(intro.on ? 3 : 2, false); cullChunks(cam, intro.on ? 40 : 26, Stage.w / Stage.h);
    if (S.far.clouds) { S.far.clouds.pos[0] = (t * 1.2) % 160 - 80; }
    var R = 40 + camS.dist * 1.6;

    Stage.r.render(S.scene, { eye: cam.eye, target: cam.target, fov: intro.on ? 40 : 26, near: 0.8, far: 700, clear: CLEAR, fog: { color: FOG, near: Math.max(R * 0.5, camS.dist * 1.4), far: R * 0.98 + 22 }, time: t });
    if (!intro.on && (++mapN % 3 === 0)) drawMap();

  }

  W.enter = function (ch) {
    if (!Stage.ok) return;
    root = document.getElementById("rg");
    if (!H.ui) buildHUD(root);
    if (!S.built) buildScene();
    Stage.stop(); Stage.r.setLight([0.7, 0.72, 0.25]); Stage.setDpr(dprQ);

    audioStart();
    if (saved) {
      var x = RW.walkable(f.x, f.z) ? f.x : SX, z = RW.walkable(f.x, f.z) ? f.z : SZ;
      applyLod(true); P.x = x; P.z = z; P.y = RW.floorY(x, z); P.yaw = 0; P.vx = P.vz = 0; intro.on = false; introCam = null; intro.blend = 0;
      H.fade.style.opacity = 0; H.ui.classList.remove("intro"); S.model.pose.eyes = 1;
      camS.tx = P.x; camS.tz = P.z; camS.ty = P.y + 1; camS.dist = camS.distT = 36;
      ensureChunks(99, true);
      if (A.ctx) A.master.gain.setTargetAtTime(A.on ? 0.9 : 0, A.ctx.currentTime, 0.8);
    } else { camS.dist = camS.distT = 36; startIntro(false); }
    running = true; last = performance.now(); requestAnimationFrame(frame);
    netConnect();
  };
  W.exit = function () {
    closeMultiplayer();
    var f = loadFlag() || {}; if (f.intro) { f.x = P.x; f.z = P.z; saveFlag(f); }
    running = false; W.active = false; paused = false; intro.on = false;
    if (A.ctx && A.master) A.master.gain.setTargetAtTime(0, A.ctx.currentTime, 0.2);
    H.ui.classList.remove("show"); H.panel.classList.remove("show"); H.ui.classList.remove("intro"); root.classList.remove("inworld");
    Stage.r.setLight([0.45, 0.78, 0.55]); Stage.setDpr(1.5);
    if (S.model) S.model.root.rot[0] = 0;
    if (typeof W.onExit === "function") W.onExit();
    Stage.start();
  };
  W.stop = function () { if (running) { running = false; } };
  // FPS real (medido nos quadros reais do navegador, sem limite artificial)

  // ===== Chat (usa a conexão online existente, só adiciona mensagens {t:"chat"}) =====
  var chatWs = null;
  function chatPoll() {
    var ws = NET.ws;
    if (ws === chatWs) return;
    chatWs = ws;
    if (!ws) return;
    ws.addEventListener("message", function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m || m.t !== "chat") return;
      if (m.id && m.id === NET.id) return;
      var r = m.id ? NET.remotes[m.id] : null, txt = m.m != null ? m.m : m.message;
      if (txt) addChatMessage(m.name || (r && r.name) || "Jogador", txt);
    });
  }
  function sendChatMessage(text) {
    var msg = String(text || "").trim().slice(0, 180); if (!msg) return false;
    var ws = NET.ws;
    if (!ws || ws.readyState !== 1 || NET.state !== "on") { addChatMessage("Sistema", "Você precisa estar online para conversar."); return false; }
    try { ws.send(JSON.stringify({ t: "chat", m: msg })); addChatMessage("Você", msg); return true; } catch (e) { addChatMessage("Sistema", "Não foi possível enviar a mensagem."); return false; }
  }

    if (!H.chatLog) return;
    var line = el("div", "wd-chat-line"), b = el("b", "", who + ": ");
    line.appendChild(b); line.appendChild(document.createTextNode(String(message).slice(0, 180))); H.chatLog.appendChild(line);
    while (H.chatLog.children.length > 45) H.chatLog.removeChild(H.chatLog.firstChild); H.chatLog.scrollTop = H.chatLog.scrollHeight;

  W.fps = function () { return { ping: FM.ping, fps: FM.fps, ms: FM.ms, worst: FM.worst, res: dprQ }; };
  W.resume = function () { if (W.active && !running) { running = true; last = performance.now(); requestAnimationFrame(frame); } };

/* ROSHY ONLINE - fluxo principal
 * ABRIR JOGO → TELA DE CARREGAMENTO → VERIFICAR PERSONAGEM → CRIAÇÃO (se necessário) → ENTRAR NO MUNDO
 * A tela de carregamento (src/loading) não é tocada: ela apenas chama window.onRoshyLoadingDone() ao terminar.
 */
(function (global) {
  "use strict";
  var D = global.RoshyData, Save = global.RoshySave, Stage = global.RoshyStage, Creator = global.RoshyCreator;
  var root, canvas, worldUI, started = false, resetArmed = 0;

  // Layout: sempre horizontal. Em celular em pé, a tela do jogo é girada 90°.
  function layout() {
    if (!root) return;
    var W = global.innerWidth, H = global.innerHeight, portrait = H > W;
    var lw = portrait ? H : W, lh = portrait ? W : H;
    root.style.width = lw + "px"; root.style.height = lh + "px";
    root.style.transform = portrait ? "translate(" + W + "px,0) rotate(90deg)" : "none";
    root.style.setProperty("--u", (Math.min(lw, lh * 16 / 9) / 100) + "px");
    Stage.resize(lw, lh, portrait);
  }

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

  function buildWorldUI() {
    worldUI = el("div", "rg-ui"); worldUI.id = "uiWorld";
    worldUI.appendChild(el("div", "rg-plate gold", "<b id=\"wName\"></b><span id=\"wInfo\"></span>"));
    var note = el("div", "rg-wnote", "Seu personagem está salvo. Toque em ENTRAR NO MUNDO para explorar.");
    worldUI.appendChild(note);
    var go = el("button", "rg-cta", "ENTRAR NO MUNDO"); go.type = "button";
    go.addEventListener("click", function () {
      var ch = Save.load();
      if (global.RoshyWorld && !Save.load()) return;
      if (typeof RoshyGame.onEnterWorld === "function") RoshyGame.onEnterWorld(ch);
      else toast("O mundo aberto ainda está em desenvolvimento.");
    });
    worldUI.appendChild(go);
    var reset = el("button", "rg-btn rg-reset", "Apagar personagem (teste)"); reset.type = "button";
    reset.addEventListener("click", function () {
      var now = Date.now();
      if (now - resetArmed < 3000) { Save.clear(); if (global.RoshyWorld) global.RoshyWorld.resetProgress(); resetArmed = 0; showCreator(); return; }
      resetArmed = now; reset.textContent = "Toque de novo para confirmar";
      setTimeout(function () { if (Date.now() - resetArmed >= 2900) { reset.textContent = "Apagar personagem (teste)"; resetArmed = 0; } }, 3100);
    });
    worldUI.appendChild(reset);
    worldUI.appendChild(el("div", "rg-toast"));
    root.appendChild(worldUI);
  }
  function toast(msg) {
    var t = worldUI.querySelector(".rg-toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 3200);
  }

  function showCreator() {
    worldUI.classList.remove("show");
    Creator.show(function (ch, persisted) {
      if (global.RoshyWorld) global.RoshyWorld.resetProgress();
      showWorld(ch);
      if (!persisted) toast("Não foi possível salvar neste navegador. O personagem vale só até fechar o jogo.");
    });
  }

  function showWorld(ch) {
    Creator.hide();
    document.getElementById("wName").textContent = ch.name;
    document.getElementById("wInfo").textContent = D.OUTFITS[ch.outfit] + " · " + D.GENDERS[ch.gender];
    Stage.setFocus("body"); Stage.setAuto(true);
    Stage.setCharacter(ch);
    worldUI.classList.add("show");
  }

  // Chamado pela tela de carregamento quando chega a 100%
  function start() {
    if (started) return; started = true;
    root = document.getElementById("rg");
    canvas = document.getElementById("rgCanvas");
    var art = document.getElementById("art");
    if (art) document.getElementById("rgBg").style.backgroundImage = "url(" + art.src + ")";

    Creator.init(root); buildWorldUI();
    layout();
    global.addEventListener("resize", layout);
    global.addEventListener("orientationchange", function () { setTimeout(layout, 150); });
    document.addEventListener("visibilitychange", function () {
      var W = global.RoshyWorld, inW = W && W.active;
      if (document.hidden) { Stage.stop(); if (inW) W.stop(); } else if (inW) W.resume(); else Stage.start();

    if (global.RoshyWorld) {

    }

      var msg = el("div", "rg-toast show", "Seu aparelho não conseguiu iniciar os gráficos 3D (WebGL).");
      root.appendChild(msg);
    }

    // VERIFICAR PERSONAGEM
    var saved = Save.load();
    if (saved) showWorld(saved); else showCreator();
  }

  var RoshyGame = { start: start, onEnterWorld: null, _layout: layout };
  global.RoshyGame = RoshyGame;

  // Ponto de ligação com a tela de carregamento existente (ela chama isto ao terminar)
  global.onRoshyLoadingDone = function () {
    var l = document.getElementById("loading");
    if (l) l.style.display = "none";
    start();
  };
})(window);

</script>
<script>
(function () {
  "use strict";


  // ---------- Layout: imagem inteira, sem cortes; em celular em pé, gira para horizontal ----------
  var loadingEl0 = document.getElementById("loading"), stage = document.querySelector(".stage");
  var FIT = "esticar";   // troque para "cobrir" para manter a proporção cortando as bordas
  function layout() {
    var W = window.innerWidth, H = window.innerHeight, portrait = H > W;
    var lw = portrait ? H : W, lh = portrait ? W : H;
    loadingEl0.style.width = lw + "px"; loadingEl0.style.height = lh + "px";
    loadingEl0.style.transform = portrait ? "translate(" + W + "px,0) rotate(90deg)" : "none";
    var sw, sh;
    if (FIT === "cobrir") { var s = Math.max(lw / 1672, lh / 941); sw = 1672 * s; sh = 941 * s; }
    else { sw = lw; sh = lh; }            // "esticar": preenche a tela toda, sem cortes
    stage.style.width = sw + "px"; stage.style.height = sh + "px"; stage.style.fontSize = (sw / 100) + "px";
    var gw = document.getElementById("gemwin");
    gw.style.backgroundImage = "url(" + document.getElementById("art").src + ")";
    gw.style.backgroundSize = sw + "px " + sh + "px";
    gw.style.backgroundPosition = (-0.4800 * sw) + "px " + (-0.8760 * sh) + "px";
  }
  layout();
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 150); });
  function goFull() {
    try {
      var el = document.documentElement;
      var p = (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
      if (p && p.then) p.then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
      }).catch(function () {});
    } catch (e) {}
    document.removeEventListener("click", goFull);
  }
  document.addEventListener("click", goFull);

  // ---------- Dicas ----------
  var TIPS = [
    ["Explore o mundo para encontrar ", "lugares secretos", "."],
    ["Colete ", "madeira", " para fabricar novos itens."],
    ["Aprimore seus equipamentos para enfrentar ", "inimigos mais fortes", "."],
    ["Explore novas regiões e descubra seus ", "segredos", "."],
    ["Utilize diferentes armas para encontrar ", "seu estilo de combate", "."]
  ];
  var tipEl = document.getElementById("tip"), tipText = document.getElementById("tipText");
  var lastTip = -1, errorMode = false;

  function render(parts) {
    tipText.textContent = "";
    parts.forEach(function (p, n) {
      if (n === 1) { var s = document.createElement("span"); s.className = "hl"; s.textContent = p; tipText.appendChild(s); }
      else tipText.appendChild(document.createTextNode(p));
    });
  }
  function nextTip(first) {
    if (errorMode) return;
    var i; do { i = Math.floor(Math.random() * TIPS.length); } while (i === lastTip);
    lastTip = i;
    if (first) { render(TIPS[i]); return; }
    tipEl.classList.add("hidden");
    setTimeout(function () { if (!errorMode) { render(TIPS[i]); tipEl.classList.remove("hidden"); } }, 350);
  }

  // ---------- Barra ----------
  var fillEl = document.getElementById("fill"), pctEl = document.getElementById("pct");
  var loadingEl = document.getElementById("loading"), art = document.getElementById("art");
  var shown = 0, target = 0, raf = null, finished = false;

  function setTarget(p) {
    target = Math.max(0, Math.min(1, p));
    if (!raf) raf = requestAnimationFrame(tick);
  }
  // Velocidade máxima da barra: 100% em no mínimo ~5 s. Nunca passa do progresso real.
  var SECONDS_TO_FULL = 5, lastT = 0;
  function tick(t) {
    var dt = lastT ? Math.min((t - lastT) / 1000, 0.1) : 0.016;
    lastT = t;
    var d = target - shown;
    shown += Math.min(d, dt / SECONDS_TO_FULL);
    if (Math.abs(target - shown) < 0.0005) shown = target;
    fillEl.style.width = (shown * 100).toFixed(2) + "%";
    pctEl.textContent = Math.round(shown * 100) + "%";
    if (shown !== target) raf = requestAnimationFrame(tick);
    else {
      raf = null; lastT = 0;
      if (target >= 1 && !finished) { finished = true; setTimeout(leave, 450); }
    }
  }

  // Recursos reais do jogo: adicione aqui (só funcionam via http/https).
  // Ex.: { url: "assets/castelo.glb", weight: 10 }
  var MANIFEST = [];
  var ART_WEIGHT = 3;
  var frac = {};

  function recompute() {
    var tw = ART_WEIGHT, done = ART_WEIGHT * (frac.__art || 0);
    MANIFEST.forEach(function (m) { tw += m.weight; done += m.weight * (frac[m.url] || 0); });
    setTarget(done / tw);
  }

  function waitArt() {
    return new Promise(function (ok, fail) {
      function done() { frac.__art = 1; recompute(); ok(); }
      if (art.complete && art.naturalWidth > 0) return done();
      art.onload = done;
      art.onerror = function () { fail(new Error("imagem")); };
    });
  }
  function loadExternal(it) {
    if (location.protocol.indexOf("http") !== 0) { frac[it.url] = 1; recompute(); return Promise.resolve(); }
    return fetch(it.url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " " + it.url);
      var total = +r.headers.get("Content-Length") || 0;
      if (!r.body || !total) return r.blob().then(function () { frac[it.url] = 1; recompute(); });
      var rd = r.body.getReader(), got = 0;
      (function pump() {
        return rd.read().then(function (x) {
          if (x.done) { frac[it.url] = 1; recompute(); return; }
          got += x.value.length; frac[it.url] = Math.min(1, got / total); recompute(); return pump();
        });
      })();
    });
  }

  function start() {
    errorMode = false; finished = false; frac = {}; shown = 0; target = 0;
    tipEl.style.cursor = ""; tipEl.onclick = null;
    nextTip(true); setTarget(0);
    Promise.all([waitArt()].concat(MANIFEST.map(loadExternal))).catch(function (e) {
      console.error(e); errorMode = true;
      render(["Falha ao carregar. ", "Toque para tentar de novo", "."]);
      tipEl.style.cursor = "pointer"; tipEl.onclick = start;
    });
  }

  function leave() {
    loadingEl.classList.add("leaving");
    setTimeout(function () {
      if (typeof window.onRoshyLoadingDone === "function") window.onRoshyLoadingDone();
      else loadingEl.style.display = "none";
    }, 600);
  }

  var loop = setInterval(function () { nextTip(false); }, 4000);
  window.addEventListener("pagehide", function () { clearInterval(loop); });
  start();
})();
</script>
